<!doctype html>
<!-- Esqueleto known-good: Escritório Vivo estilo The Sims 2 (validado 11/09/2026)
     Regras: HUMANOS Sims (cabeça pele+cabelo, olhos piscam, boca, camisa+gravata, braços, pernas),
     nome na cabeça, fileiras 6/4/3 por largura, zoom (+/−, Ctrl+scroll, pinça), botão ENVIAR,
     grade determinística na criação + ResizeObserver, TTS via /tts?text=&voice=faber. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESCRITÓRIO — TEMA</title>
<style>
  body{margin:0;background:#160b12;font-family:Aptos,Segoe UI,sans-serif;color:#eee;overflow:hidden}
  #office{position:relative;height:calc(100vh - 90px);overflow:auto}
  /* ===== HUMANO estilo The Sims ===== */
  .humano{position:absolute;width:38px;height:56px;transition:left 3.2s linear,top 2.8s linear;z-index:6;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
  .humano .nome{position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.6);color:#fff;border:1px solid var(--rc);border-radius:8px;padding:1px 6px;font-size:.55rem;font-weight:700;text-shadow:0 1px 2px #000;z-index:9}
  .humano .cabeca{width:24px;height:24px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7d3a8,#e8b98a);position:relative}
  .humano .cabeca::before{content:'';position:absolute;top:-3px;left:1px;right:1px;height:11px;border-radius:12px 12px 3px 3px;background:#2c2620}
  .humano .olhos{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
  .humano .olho{width:3px;height:3px;border-radius:50%;background:#26201a}
  .humano .boca{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:7px;height:2px;background:#a3674a;border-radius:2px}
  .humano .corpo{width:26px;height:22px;margin:1px auto 0;border-radius:9px 9px 4px 4px;background:linear-gradient(160deg,color-mix(in srgb,var(--camisa) 65%,#fff),var(--camisa));position:relative}
  .humano .corpo::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:3px;height:9px;background:var(--gravata,#1a2233)}
  .humano .braco{position:absolute;width:6px;height:16px;background:var(--camisa);border-radius:3px;top:24px}
  .humano .braco.e{left:-1px;transform:rotate(8deg)}.humano .braco.d{right:-2px;transform:rotate(-8deg)}
  .humano .perna{position:absolute;width:7px;height:15px;background:#333e4e;top:46px;border-radius:2px}
  .humano .perna.e{left:8px}.humano .perna.d{right:8px}
  .humano.sentado .perna{height:7px;top:40px}
  .humano.falando{outline:3px solid #FFD700;outline-offset:4px;border-radius:8px}
  /* ===== Estação: mesa + cadeira (Sims 2) ===== */
  .estacao{position:absolute;z-index:7}
  .mesa{width:96px;height:44px;background:linear-gradient(180deg,#e8e8e8,#b8b8b8);border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.45);position:relative}
  .mesa::before{content:'';position:absolute;top:-26px;left:30px;width:38px;height:24px;background:#1b2536;border:2px solid #31405a;border-radius:4px} /* monitor */
  .cadeira{position:absolute;left:36px;top:-16px;width:34px;height:26px;background:#2a3345;border-radius:6px 6px 3px 3px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
  .tag{position:absolute;z-index:8;font-size:.6rem;background:rgba(0,0,0,.45);border:1px solid #c9a227;color:#e9d8a6;padding:2px 6px;border-radius:6px;white-space:nowrap}
  .placa{position:absolute;left:6px;top:46px;background:rgba(0,0,0,.55);border:1px dashed #1fd3c4;color:#1fd3c4;font-size:.55rem;padding:1px 6px;border-radius:6px;white-space:nowrap}
  .bubble{position:absolute;max-width:220px;background:#fff;color:#111;border-radius:10px;padding:6px 10px;font-size:.72rem;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .bubble .who{display:block;font-weight:800;font-size:.6rem;color:#0b7285}
  .bubble.me{background:#1fd3c4;color:#06231f}
  .bubble.me .who{color:#06231f}
  /* ===== Zoom ===== */
  #zoomBar{position:fixed;right:14px;bottom:56px;z-index:40;display:flex;gap:6px}
  #zoomBar button{width:34px;height:34px;border-radius:8px;border:1px solid #31405a;background:#0d1b2e;color:#7fe7ff;font-size:1rem;cursor:pointer}
  #zoomPct{background:rgba(0,0,0,.5);color:#7fe7ff;border-radius:8px;padding:0 8px;display:flex;align-items:center;font-size:.75rem}
  /* ===== Rodapé com botão ENVIAR (não depender de Enter!) ===== */
  footer{position:fixed;bottom:0;left:0;right:0;height:52px;display:flex;gap:8px;align-items:center;padding:0 10px;background:#0b1220;border-top:1px solid #31405a;z-index:50}
  footer input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid #31405a;background:#101a2b;color:#eee}
  footer button{width:40px;height:38px;border-radius:8px;border:1px solid #1fd3c4;background:#0d1b2e;color:#7fe7ff;cursor:pointer;font-size:1rem}
  @media (max-width:768px){
    .mesa{transform:scale(.78);transform-origin:top left}
    .humano{transform:scale(.85)}
    .tag{font-size:.55rem}
  }
</style>
</head>
<body>
<div id="office"></div>
<footer>
  <input id="msg" placeholder="Mande algo pro time…">
  <button id="btnEnviar" title="Enviar">➤</button>
  <button id="btnSom" title="Som">🔊</button>
</footer>
<script>
/* ===== CONFIG: um agente por linha [nome, função/tag, cor por função, domínio] ===== */
const AGENTES = [
  ['Exemplo Silva','DOMÍNIO/ÁREA','#4caf50','exemplo'],
];
const TAREFAS = {exemplo:['Trabalhando na tarefa A…','Fechando relatório B…']};
const CAFES = ['☕','🍵','🥤'];

const office=document.getElementById('office');
const W=()=>office.clientWidth, H=()=>office.clientHeight, MOBILE=()=>W()<769;

/* ===== GRADE DETERMINÍSTICA (na criação — sem aleatório) ===== */
window.agentsTotal=AGENTES.length; let gradeIdx=0;
function randomPos(){
  const margem=MOBILE()?14:60;
  const cols=W()>=1100?6:W()>=640?4:3, rows=Math.ceil(agentsTotal/cols);
  const cw=(W()-margem*2)/cols, ch=(H()-150)/rows;
  const idx=gradeIdx++;
  return {x:margem+(idx%cols)*cw+10, y:150+Math.floor(idx/cols)*ch+20};
}

const stations={};
const agents=AGENTES.map(a=>{
  const p=randomPos();
  const est=document.createElement('div'); est.className='estacao';
  est.style.left=(p.x-36)+'px'; est.style.top=(p.y+18)+'px';
  est.innerHTML='<div class="cadeira"></div><div class="mesa"></div>';
  const el=document.createElement('div'); el.className='humano sentado';
  el.style.setProperty('--rc',a[2]); el.style.setProperty('--camisa',a[2]);
  el.style.left=(p.x+32)+'px'; el.style.top=(p.y-16)+'px'; el.style.zIndex=5;
  el.innerHTML='<div class="nome">'+a[0].split(' ')[0].toUpperCase()+'</div>'
    +'<div class="cabeca"><div class="olhos"><div class="olho"></div><div class="olho"></div></div><div class="boca"></div></div>'
    +'<div class="corpo"></div><div class="braco e"></div><div class="braco d"></div>'
    +'<div class="perna e"></div><div class="perna d"></div>';
  const tag=document.createElement('div'); tag.className='tag'; tag.textContent=a[1];
  tag.style.left=(p.x+40)+'px'; tag.style.top=(p.y-52)+'px';
  office.append(est,el,tag);
  stations[a[0]]={est,x:p.x-36,y:p.y+18};
  return {n:a[0],dom:a[3],c:a[2],el,est_tag:a[1],x:p.x,y:p.y};
});
// tag por agente (adicionar após o map para manter ordem DOM: estação, humano, tag)
agents.forEach(a=>{ const t=document.createElement('div'); t.className='tag'; t.textContent=a.est_tag;
  const st=stations[a.n]; t.style.left=(st.x+40)+'px'; t.style.top=(st.y-52)+'px'; office.append(t); a.tag=t; });

/* ===== relayout: move estação + humano + tag juntos; TODAS as âncoras ===== */
function relayout(){
  const margem=MOBILE()?14:60;
  const cols=W()>=1100?6:W()>=640?4:3, rows=Math.ceil(agents.length/cols);
  const cw=(W()-margem*2)/cols, ch=(H()-150)/rows;
  agents.forEach((a,i)=>{
    const cx=i%cols, cy=Math.floor(i/cols);
    const st=stations[a.n]; if(!st) return;
    st.x=margem+cx*cw+10; st.y=150+cy*ch+20;
    if(st.est){st.est.style.left=st.x+'px'; st.est.style.top=st.y+'px';}
    if(a.el){a.el.style.left=(st.x+32)+'px'; a.el.style.top=(st.y-16)+'px';}
    if(a.tag){a.tag.style.left=(st.x+40)+'px'; a.tag.style.top=(st.y-52)+'px';}
  });
}
window.addEventListener('resize',relayout);
window.addEventListener('load',relayout);
[100,300,600,1200,2000,3000,4500].forEach(t=>setTimeout(relayout,t));
setInterval(relayout,3000);
new ResizeObserver(relayout).observe(office); relayout();

/* ===== ZOOM: botões + Ctrl+scroll + pinça ===== */
let zoom=1;
function aplicarZoom(){office.style.transform='scale('+zoom+')';office.style.transformOrigin='top center';
  const z=document.getElementById('zoomPct'); if(z)z.textContent=Math.round(zoom*100)+'%';}
window.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom=Math.min(2,Math.max(.6,zoom-Math.sign(e.deltaY)*.1));aplicarZoom();}},{passive:false});
let pinch0=0;
office.addEventListener('touchmove',e=>{if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinch0){zoom=Math.min(2,Math.max(.6,zoom*d/pinch0));aplicarZoom();} pinch0=d; e.preventDefault();}},{passive:false});
office.addEventListener('touchend',()=>pinch0=0);
const zbar=document.createElement('div'); zbar.id='zoomBar';
zbar.innerHTML='<button id="zm-">−</button><span id="zoomPct">100%</span><button id="zm+">+</button>';
document.body.append(zbar);
document.getElementById('zm+').onclick=()=>{zoom=Math.min(2,zoom+.1);aplicarZoom();};
document.getElementById('zm-').onclick=()=>{zoom=Math.max(.6,zoom-.1);aplicarZoom();};

/* ===== Falar + botão ENVIAR (mesma função p/ Enter e clique) ===== */
let somAtivo=false;
function despachar(){
  const val=document.getElementById('msg').value; if(!val) return;
  const b=document.createElement('div'); b.className='bubble me';
  b.innerHTML='<span class="who">IGOR</span>'+val;
  b.style.left=Math.max(10,W()/2-160)+'px'; b.style.top=(H()-120)+'px';
  office.append(b); setTimeout(()=>b.remove(),5000);
  setTimeout(()=>{
    const t=(val||'').toLowerCase();
    let a=agents.find(g=>t.includes(g.dom))||agents[0];
    const r=document.createElement('div'); r.className='bubble';
    r.innerHTML='<span class="who">'+a.n+'</span>On it! Abrindo o domínio '+a.est_tag+'.';
    const st=stations[a.n];
    r.style.left=(st.x+30)+'px'; r.style.top=(st.y-14)+'px';
    office.append(r); setTimeout(()=>r.remove(),5000);
    a.el.classList.add('falando'); setTimeout(()=>a.el.classList.remove('falando'),5600);
  },1100);
  document.getElementById('msg').value='';
}
document.getElementById('btnEnviar').addEventListener('click',despachar);
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')despachar();});
</script>
</body>
</html>
